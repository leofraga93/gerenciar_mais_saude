name: CI

on: 
  pull_request: 
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Baixar código do projeto
    uses: actions/checkout@v4
    
    - name: Configurar Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
    
    - name: Instalar dependências
    run: npm ci

    - name: Executar testes
    run: npm run lint

    - name: Executar build
    run: npm run build